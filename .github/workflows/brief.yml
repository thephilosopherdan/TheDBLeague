name: Build brief.json
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build brief.json
        run: node scripts/build-brief.mjs
      - name: Commit if changed
        run: |
          git config user.name "brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/brief.json
          git diff --cached --quiet || git commit -m "brief.json $(date -u +%FT%TZ)"
          git push
